<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        h4 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-success {
            background-color: #28a745;
            border: none;
        }
        .btn-success:hover {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

<div class="container">
    <h4>Caesar Cipher</h4>
    <form method="POST" action="/encrypt">
        <div class="mb-3">
            <label class="form-label">Plain Text</label>
            <input type="text" class="form-control" name="inputPlainText" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Key</label>
            <input type="number" class="form-control" name="inputKeyPlain" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Encrypt</button>
    </form>
    <form method="POST" action="/decrypt" style="margin-top: 20px;">
        <div class="mb-3">
            <label class="form-label">Cipher Text</label>
            <input type="text" class="form-control" name="inputCipherText" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Key</label>
            <input type="number" class="form-control" name="inputKeyCipher" required>
        </div>
        <button type="submit" class="btn btn-success btn-block">Decrypt</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
