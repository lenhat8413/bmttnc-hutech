<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigenère Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        .error-alert {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mt-4">Vigenère Cipher</h3>
    
    <!-- Error Alert -->
    <div class="alert alert-danger error-alert" id="errorAlert">
        Error: Only alphabetic characters (A-Z, a-z) are allowed. Numbers and special characters are not permitted!
    </div>

    <h4 class="mt-4">Encryption</h4>
    <form id="encrypt-form" onsubmit="return validateInput('plain_text', 'key', 'encrypt')">
        <div class="mb-3">
            <label class="form-label">Plain text:</label>
            <input type="text" class="form-control" id="plain_text" placeholder="Enter text" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="text" class="form-control" id="key" placeholder="Enter Key" required/>
        </div>
        <button type="submit" class="btn btn-primary">Encrypt</button>
    </form>

    <h4 class="mt-4">Decryption</h4>
    <form id="decrypt-form" onsubmit="return validateInput('cipher_text', 'key_decrypt', 'decrypt')">
        <div class="mb-3">
            <label class="form-label">Cipher text:</label>
            <input type="text" class="form-control" id="cipher_text" placeholder="Enter cipher text" required/>
        </div>
        <div class="mb-3">
            <label class="form-label">Key:</label>
            <input type="text" class="form-control" id="key_decrypt" placeholder="Enter Key" required/>
        </div>
        <button type="submit" class="btn btn-success">Decrypt</button>
    </form>
</div>

<script>
    // Input validation function
    function validateInput(textFieldId, keyFieldId, action) {
        const textInput = document.getElementById(textFieldId).value;
        const keyInput = document.getElementById(keyFieldId).value;
        const errorAlert = document.getElementById('errorAlert');
        
        // Regular expression to allow only letters
        const lettersOnly = /^[a-zA-Z]+$/;
        
        if (!lettersOnly.test(keyInput)) {
            errorAlert.style.display = 'block';
            document.getElementById(textFieldId).focus();
            return false;
        }
        
        if (!lettersOnly.test(keyInput)) {
            errorAlert.style.display = 'block';
            document.getElementById(keyFieldId).focus();
            return false;
        }
        
        errorAlert.style.display = 'none';
        
        // Proceed with encryption/decryption
        if (action === 'encrypt') {
            encryptData();
        } else {
            decryptData();
        }
        
        return false; // Prevent default form submission
    }

    // Encryption function
    function encryptData() {
        const data = {
            plain_text: document.getElementById('plain_text').value.toUpperCase(),
            key: document.getElementById('key').value.toUpperCase()
        };
        
        fetch('/vigenere/encrypt', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            alert('Encrypted Text: ' + data.encrypted_text);
        })
        .catch(error => {
            alert('Error during encryption: ' + error.message);
        });
    }

    // Decryption function
    function decryptData() {
        const data = {
            cipher_text: document.getElementById('cipher_text').value.toUpperCase(),
            key: document.getElementById('key_decrypt').value.toUpperCase()
        };
        
        fetch('/vigenere/decrypt', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            alert('Decrypted Text: ' + data.decrypted_text);
        })
        .catch(error => {
            alert('Error during decryption: ' + error.message);
        });
    }
</script>

</body>
</html>
